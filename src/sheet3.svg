<svg xmlns="http://www.w3.org/2000/svg" width="1587" height="1123" viewBox="0 0 1587 1123"><rect width="1587" height="1123" fill="#fff"/><text x="52.0" y="50.0" font-size="15" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">ELECTRICAL — SOCKET IN THE BENCH, LED BEHIND THE HEADER</text><text x="52.0" y="70.0" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Your existing outlet is low and central — right where the bench is. Rather than fight that, it feeds a socket INSIDE the right-hand bench drawer: a charging drawer.</text><text x="52.0" y="86.0" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Sconces are gone. The only thing still going up the wall is the low-voltage LED run, so the 30mm service void behind the nook back now carries one cable.</text><rect x="52.0" y="112.0" width="430.0" height="582.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="68.0" cy="128.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="68.0" y="132.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">A</text><text x="86.0" y="133.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">NOOK BACK — only one device now</text><text x="472.0" y="133.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:12</text><rect x="148.0" y="184.0" width="378.0" height="389.3" fill="#e9e6df" stroke="#141414" stroke-width="0.9"/><rect x="148.0" y="531.7" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="488.2" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="444.8" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="401.3" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="357.9" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="314.4" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="270.9" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="227.5" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="184.0" width="378.0" height="41.6" fill="#e1ddd4" stroke="#141414" stroke-width="0.45"/><rect x="148.0" y="573.3" width="378.0" height="7.0" fill="#d8cfc0" stroke="#141414" stroke-width="0.8"/><text x="337.0" y="592.3" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench deck  +380</text><text x="337.0" y="158.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">header fascia u/s  +1616</text><rect x="148.0" y="184.0" width="378.0" height="9.0" fill="#fff" stroke="#b8860b" stroke-width="1.5"/><text x="337.0" y="173.0" font-size="9" fill="#8a6016" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">LED STRIP — concealed behind the 62 header fascia</text><text x="337.0" y="239.4" font-size="9" fill="#3d3d3d" text-anchor="middle" font-weight="400" font-family="Helvetica,Arial,sans-serif">washes down the shiplap</text><line x1="128.0" y1="184.0" x2="128.0" y2="573.3" stroke="#9c2b1b" stroke-width="0.8"/><line x1="124.5" y1="184.0" x2="131.5" y2="184.0" stroke="#9c2b1b" stroke-width="0.8"/><line x1="124.5" y1="573.3" x2="131.5" y2="573.3" stroke="#9c2b1b" stroke-width="0.8"/><text x="123.5" y="378.6" font-size="10" fill="#9c2b1b" text-anchor="middle" font-weight="600" font-family="'DejaVu Sans Mono',monospace" transform="rotate(-90 123.5 378.6)">1236 nook clear</text><text x="64.0" y="636.0" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">NO boxes are cut into the nook back at all. The shiplap runs</text><text x="64.0" y="650.0" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">unbroken from the bench deck up to the fascia.</text><text x="64.0" y="670.0" font-size="9.5" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">That is the whole point of putting the socket in a drawer.</text><rect x="504.0" y="112.0" width="540.0" height="250.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="520.0" cy="128.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="520.0" y="132.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">B</text><text x="538.0" y="133.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">HORIZONTAL SECTION through the nook back</text><text x="1034.0" y="133.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:2</text><rect x="559.5" y="170.0" width="189.0" height="110.0" fill="#f2f0eb" stroke="#141414" stroke-width="0.9"/><rect x="654.0" y="170.0" width="52.9" height="110.0" fill="#fbe6c8" stroke="#9c2b1b" stroke-width="1.3"/><rect x="706.9" y="170.0" width="35.9" height="110.0" fill="#e9e6df" stroke="#141414" stroke-width="0.9"/><rect x="742.8" y="192.0" width="22.7" height="66.0" fill="#e1ddd4" stroke="#141414" stroke-width="0.9"/><circle cx="682.3" cy="225.0" r="13.0" fill="#fff" stroke="#9c2b1b" stroke-width="1.4"/><text x="682.3" y="229.0" font-size="10" fill="#9c2b1b" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">C</text><text x="606.8" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">concrete</text><text x="680.5" y="296.0" font-size="9.5" fill="#9c2b1b" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">28 VOID</text><text x="725.8" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">19 back</text><text x="754.2" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">12 shiplap</text><text x="682.3" y="310.0" font-size="9" fill="#9c2b1b" text-anchor="middle" font-weight="400" font-family="Helvetica,Arial,sans-serif">conduit runs here</text><text x="794.0" y="182.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Five 45-wide furring strips hold the back panel</text><text x="794.0" y="198.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">off the concrete. The gaps between them are</text><text x="794.0" y="214.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">the chase for ONE low-voltage cable.</text><text x="794.0" y="238.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Nothing is cut into the wall: no dust, no rebar,</text><text x="794.0" y="254.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">no risk to the 4" drain stack.</text><text x="794.0" y="282.0" font-size="10" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">Keep the void even though only one cable</text><text x="794.0" y="298.0" font-size="10" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">uses it — it costs five strips of MDF.</text><rect x="504.0" y="386.0" width="540.0" height="568.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="520.0" cy="402.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="520.0" y="406.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">C</text><text x="538.0" y="407.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">VERTICAL ROUTE — existing box to drawer socket and LED</text><text x="1034.0" y="407.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:14</text><rect x="566.0" y="451.6" width="30.0" height="472.4" fill="#f2f0eb" stroke="#141414" stroke-width="0.8"/><text x="562.0" y="440.8" font-size="9" fill="#3d3d3d" text-anchor="end" font-weight="600" font-family="Helvetica,Arial,sans-serif">concrete</text><rect x="596.0" y="470.5" width="8.1" height="351.0" fill="#fbe6c8" stroke="#9c2b1b" stroke-width="1.2"/><rect x="596.0" y="819.3" width="140.0" height="8.0" fill="#d8cfc0" stroke="#141414" stroke-width="0.9"/><rect x="596.0" y="825.2" width="140.0" height="67.0" fill="#fff" stroke="#141414" stroke-width="0.9"/><rect x="591.0" y="834.9" width="22.0" height="14.0" fill="#fff" stroke="#8c3b2e" stroke-width="1.5"/><line x1="601.0" y1="838.7" x2="601.0" y2="583.8" stroke="#9c2b1b" stroke-width="2.2" stroke-dasharray="5 3"/><rect x="597.0" y="479.6" width="16.0" height="11.0" fill="#fff" stroke="#c08a1f" stroke-width="1.4"/><text x="620.0" y="489.7" font-size="9.5" fill="#8a6016" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">LED strip at 1616, behind the fascia</text><rect x="630.0" y="866.0" width="22.0" height="13.0" fill="#fff" stroke="#2f6b3f" stroke-width="1.5"/><text x="660.0" y="877.0" font-size="9.5" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">SOCKET inside the drawer</text><text x="748.0" y="822.2" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench deck — ONE Ø20 hole at the rear</text><text x="796.0" y="860.5" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench drawer — pull it out and the old</text><text x="796.0" y="873.5" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">box is in reach. That is the access.</text><text x="796.0" y="886.5" font-size="9.5" fill="#8a6016" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">The LED driver lives in it too.</text><text x="620.0" y="838.9" font-size="9.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">EXISTING BOX — stays where it is,</text><text x="620.0" y="851.9" font-size="9.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">live, as an accessible junction</text><text x="748.0" y="631.0" font-size="9.5" fill="#9c2b1b" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">28 void — one LV cable only</text><text x="1076.0" y="132.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">WHAT THE ELECTRICIAN ACTUALLY DOES</text><line x1="1076.0" y1="139.0" x2="1541.4" y2="139.0" stroke="#141414" stroke-width="0.8"/><circle cx="1085.0" cy="156.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="159.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">1</text><text x="1102.0" y="160.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Leaves the existing box where it is, live. It ends up behind</text><text x="1102.0" y="175.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">the right-hand bench drawer, which pulls out — that is the</text><text x="1102.0" y="190.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">access.</text><circle cx="1085.0" cy="216.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="219.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">2</text><text x="1102.0" y="220.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Takes a spur from it to a socket mounted INSIDE that drawer.</text><text x="1102.0" y="235.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Charging drawer: phones and the LED driver live in there,</text><text x="1102.0" y="250.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">nothing on show.</text><circle cx="1085.0" cy="276.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="279.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">3</text><text x="1102.0" y="280.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Runs ONE low-voltage cable from the driver, through a Ø20 hole</text><text x="1102.0" y="295.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">at the rear of the bench deck, up inside the 30mm void to the</text><text x="1102.0" y="310.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">header.</text><circle cx="1085.0" cy="336.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="339.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">4</text><text x="1102.0" y="340.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Terminates at the LED strip behind the 62mm header fascia,</text><text x="1102.0" y="355.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">washing down the shiplap. No sconces, no boxes in the nook</text><text x="1102.0" y="370.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">back.</text><circle cx="1085.0" cy="396.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="399.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">5</text><text x="1102.0" y="400.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Nothing is chased into the concrete. No core drilling, no</text><text x="1102.0" y="415.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">rebar scanning, no risk to the 4" drain stack in this wall.</text><text x="1076.0" y="453.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">SEQUENCE MATTERS</text><line x1="1076.0" y1="460.0" x2="1541.4" y2="460.0" stroke="#141414" stroke-width="0.8"/><text x="1076.0" y="481.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Conduit and boxes go in while the nook back is off. Once the</text><text x="1076.0" y="496.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">battens are glued on and the unit is sprayed, changing a box</text><text x="1076.0" y="511.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">position means taking the back panel out again.</text><text x="1076.0" y="537.0" font-size="10.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">STILL UNKNOWN: the exact height and offset of your existing</text><text x="1076.0" y="552.0" font-size="10.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">outlet. Measure it and I will put it on the drawing properly.</text><line x1="40.0" y1="1066.5" x2="1547.4" y2="1066.5" stroke="#141414" stroke-width="1.0"/><text x="40.0" y="1084.5" font-size="15" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">MAIN-ROOM NOOK UNIT</text><text x="40.0" y="1100.5" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Sheet 3 — electrical</text><text x="1547.4" y="1084.5" font-size="11" fill="#9c2b1b" text-anchor="end" font-weight="700" font-family="Helvetica,Arial,sans-serif">v1.0 DESIGN LOCKED · NOT site-measured — do not cut</text><text x="1547.4" y="1100.5" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">mm · A3 · sheet 3 of 3</text></svg>