<svg xmlns="http://www.w3.org/2000/svg" width="1587" height="1123" viewBox="0 0 1587 1123"><rect width="1587" height="1123" fill="#fff"/><text x="52.0" y="50.0" font-size="15" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">ELECTRICAL — WHY THE SOCKET MOVES</text><text x="52.0" y="70.0" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Your existing outlet is low and central, so it lands directly behind the bench drawers. A live box may not be buried behind fixed joinery with no access.</text><text x="52.0" y="86.0" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Instead of chasing three new boxes into 200mm concrete, the nook back is held 30mm off the wall. That gap is the chase. Everything wires inside it.</text><rect x="52.0" y="112.0" width="430.0" height="582.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="68.0" cy="128.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="68.0" y="132.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">A</text><text x="86.0" y="133.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">NOOK BACK, seen from the room</text><text x="472.0" y="133.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:12</text><rect x="148.0" y="184.0" width="378.0" height="409.4" fill="#e9e6df" stroke="#141414" stroke-width="0.9"/><rect x="148.0" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="207.3" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="266.6" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="326.0" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="385.3" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="444.6" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="503.9" y="184.0" width="22.0" height="409.4" fill="#e1ddd4" stroke="#141414" stroke-width="0.4"/><rect x="148.0" y="593.4" width="378.0" height="7.0" fill="#d8cfc0" stroke="#141414" stroke-width="0.8"/><text x="337.0" y="612.4" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench deck  +380</text><text x="337.0" y="176.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">header fascia u/s  +1600</text><rect x="239.3" y="383.7" width="27.1" height="27.1" fill="#fff" stroke="#2f6b3f" stroke-width="1.4"/><text x="252.9" y="377.7" font-size="9" fill="#2f6b3f" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">SOCKET</text><rect x="214.1" y="306.8" width="34.6" height="28.3" fill="#fff" stroke="#1d5f91" stroke-width="1.4"/><text x="231.5" y="300.8" font-size="9" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">SCONCE</text><rect x="425.2" y="306.8" width="34.6" height="28.3" fill="#fff" stroke="#1d5f91" stroke-width="1.4"/><text x="442.5" y="300.8" font-size="9" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">SCONCE</text><line x1="128.0" y1="398.2" x2="128.0" y2="593.4" stroke="#9c2b1b" stroke-width="0.8"/><line x1="124.5" y1="398.2" x2="131.5" y2="398.2" stroke="#9c2b1b" stroke-width="0.8"/><line x1="124.5" y1="593.4" x2="131.5" y2="593.4" stroke="#9c2b1b" stroke-width="0.8"/><text x="123.5" y="495.8" font-size="10" fill="#9c2b1b" text-anchor="middle" font-weight="600" font-family="'DejaVu Sans Mono',monospace" transform="rotate(-90 123.5 495.8)">1000</text><line x1="94.0" y1="319.4" x2="94.0" y2="593.4" stroke="#9c2b1b" stroke-width="0.8"/><line x1="90.5" y1="319.4" x2="97.5" y2="319.4" stroke="#9c2b1b" stroke-width="0.8"/><line x1="90.5" y1="593.4" x2="97.5" y2="593.4" stroke="#9c2b1b" stroke-width="0.8"/><text x="89.5" y="456.4" font-size="10" fill="#9c2b1b" text-anchor="middle" font-weight="600" font-family="'DejaVu Sans Mono',monospace" transform="rotate(-90 89.5 456.4)">1250</text><line x1="231.5" y1="641.4" x2="442.5" y2="641.4" stroke="#9c2b1b" stroke-width="0.8"/><line x1="231.5" y1="637.9" x2="231.5" y2="644.9" stroke="#9c2b1b" stroke-width="0.8"/><line x1="442.5" y1="637.9" x2="442.5" y2="644.9" stroke="#9c2b1b" stroke-width="0.8"/><text x="337.0" y="637.4" font-size="9.5" fill="#9c2b1b" text-anchor="middle" font-weight="600" font-family="'DejaVu Sans Mono',Consolas,monospace">670 between sconce centres</text><text x="64.0" y="664.0" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Heights from finished floor. Final positions are the חשמלאי's call —</text><text x="64.0" y="678.0" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">cut the boxes in the back panel AFTER he marks them on site.</text><rect x="504.0" y="112.0" width="540.0" height="250.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="520.0" cy="128.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="520.0" y="132.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">B</text><text x="538.0" y="133.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">HORIZONTAL SECTION through the nook back</text><text x="1034.0" y="133.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:2</text><rect x="559.5" y="170.0" width="189.0" height="110.0" fill="#f2f0eb" stroke="#141414" stroke-width="0.9"/><rect x="654.0" y="170.0" width="113.4" height="110.0" fill="#fbe6c8" stroke="#9c2b1b" stroke-width="1.3"/><rect x="710.7" y="170.0" width="68.0" height="110.0" fill="#e9e6df" stroke="#141414" stroke-width="0.9"/><rect x="744.7" y="192.0" width="45.4" height="66.0" fill="#e1ddd4" stroke="#141414" stroke-width="0.9"/><circle cx="682.3" cy="225.0" r="13.0" fill="#fff" stroke="#9c2b1b" stroke-width="1.4"/><text x="682.3" y="229.0" font-size="10" fill="#9c2b1b" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">C</text><text x="606.8" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">concrete</text><text x="682.3" y="296.0" font-size="9.5" fill="#9c2b1b" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">30 VOID</text><text x="727.7" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">18 back</text><text x="756.0" y="296.0" font-size="9.5" fill="#3d3d3d" text-anchor="middle" font-weight="600" font-family="Helvetica,Arial,sans-serif">12 batten</text><text x="682.3" y="310.0" font-size="9" fill="#9c2b1b" text-anchor="middle" font-weight="400" font-family="Helvetica,Arial,sans-serif">conduit runs here</text><text x="794.0" y="182.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">A 45-wide furring strip every ~300 holds the</text><text x="794.0" y="198.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">back panel off the concrete. The gaps between</text><text x="794.0" y="214.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">them are the chase.</text><text x="794.0" y="238.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Nothing is cut into the wall: no dust, no rebar,</text><text x="794.0" y="254.0" font-size="10" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">no risk to the 4" drain stack.</text><text x="794.0" y="282.0" font-size="10" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">Cost of the whole change:</text><text x="794.0" y="298.0" font-size="10" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">five strips of 30mm MDF.</text><rect x="504.0" y="386.0" width="540.0" height="568.0" fill="#fff" stroke="#c9c5bd" stroke-width="0.8"/><circle cx="520.0" cy="402.0" r="11.0" fill="#fff" stroke="#141414" stroke-width="1.1"/><text x="520.0" y="406.0" font-size="11" fill="#141414" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">C</text><text x="538.0" y="407.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">VERTICAL ROUTE — existing box to the new outlets</text><text x="1034.0" y="407.0" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">1:14</text><rect x="566.0" y="451.6" width="30.0" height="472.4" fill="#f2f0eb" stroke="#141414" stroke-width="0.8"/><text x="562.0" y="440.8" font-size="9" fill="#3d3d3d" text-anchor="end" font-weight="600" font-family="Helvetica,Arial,sans-serif">concrete</text><rect x="596.0" y="470.5" width="8.1" height="351.0" fill="#fbe6c8" stroke="#9c2b1b" stroke-width="1.2"/><rect x="596.0" y="819.3" width="140.0" height="8.0" fill="#d8cfc0" stroke="#141414" stroke-width="0.9"/><rect x="596.0" y="825.2" width="140.0" height="67.0" fill="#fff" stroke="#141414" stroke-width="0.9"/><rect x="591.0" y="834.9" width="22.0" height="14.0" fill="#fff" stroke="#8c3b2e" stroke-width="1.5"/><line x1="601.0" y1="838.7" x2="601.0" y2="583.8" stroke="#9c2b1b" stroke-width="2.2" stroke-dasharray="5 3"/><rect x="597.0" y="645.9" width="16.0" height="11.0" fill="#fff" stroke="#2f6b3f" stroke-width="1.4"/><text x="620.0" y="656.0" font-size="9.5" fill="#2f6b3f" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">new socket</text><rect x="597.0" y="578.4" width="16.0" height="11.0" fill="#fff" stroke="#1d5f91" stroke-width="1.4"/><text x="620.0" y="588.5" font-size="9.5" fill="#1d5f91" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">sconce feed</text><text x="748.0" y="822.2" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench deck — ONE Ø30 hole at the rear</text><text x="748.0" y="860.5" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">bench drawer — pull it out and the old</text><text x="748.0" y="873.5" font-size="9.5" fill="#3d3d3d" text-anchor="start" font-weight="600" font-family="Helvetica,Arial,sans-serif">box is in reach. That is the access.</text><text x="620.0" y="838.9" font-size="9.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">EXISTING BOX — stays where it is,</text><text x="620.0" y="851.9" font-size="9.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">live, as an accessible junction</text><text x="748.0" y="631.0" font-size="9.5" fill="#9c2b1b" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">30 service void</text><text x="1076.0" y="132.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">WHAT THE ELECTRICIAN ACTUALLY DOES</text><line x1="1076.0" y1="139.0" x2="1541.4" y2="139.0" stroke="#141414" stroke-width="0.8"/><circle cx="1085.0" cy="156.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="159.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">1</text><text x="1102.0" y="160.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Leaves the existing box exactly where it is, live, as a</text><text x="1102.0" y="175.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">junction. It ends up behind the centre bench drawer, which</text><text x="1102.0" y="190.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">pulls out — that satisfies the access requirement.</text><circle cx="1085.0" cy="216.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="219.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">2</text><text x="1102.0" y="220.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Drills one Ø30 hole through the rear of the bench deck, in</text><text x="1102.0" y="235.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">line with the void.</text><circle cx="1085.0" cy="261.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="264.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">3</text><text x="1102.0" y="265.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Runs flexible conduit up inside the 30mm void to a new socket</text><text x="1102.0" y="280.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">at 1000 and two sconce boxes at 1250.</text><circle cx="1085.0" cy="306.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="309.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">4</text><text x="1102.0" y="310.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Nothing is chased into the concrete. No core drilling, no</text><text x="1102.0" y="325.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">rebar scanning, no risk to the 4" drain stack in this wall.</text><circle cx="1085.0" cy="351.0" r="9.5" fill="#fff" stroke="#1d5f91" stroke-width="1.2"/><text x="1085.0" y="354.5" font-size="9.5" fill="#1d5f91" text-anchor="middle" font-weight="700" font-family="Helvetica,Arial,sans-serif">5</text><text x="1102.0" y="355.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Marks the three box positions on the back panel before it is</text><text x="1102.0" y="370.0" font-size="10.5" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">sprayed. The נגר cuts them, not the electrician.</text><text x="1076.0" y="408.0" font-size="12" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">SEQUENCE MATTERS</text><line x1="1076.0" y1="415.0" x2="1541.4" y2="415.0" stroke="#141414" stroke-width="0.8"/><text x="1076.0" y="436.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Conduit and boxes go in while the nook back is off. Once the</text><text x="1076.0" y="451.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">battens are glued on and the unit is sprayed, changing a box</text><text x="1076.0" y="466.0" font-size="10.5" fill="#9c2b1b" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">position means taking the back panel out again.</text><text x="1076.0" y="492.0" font-size="10.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">STILL UNKNOWN: the exact height and offset of your existing</text><text x="1076.0" y="507.0" font-size="10.5" fill="#8c3b2e" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">outlet. Measure it and I will put it on the drawing properly.</text><line x1="40.0" y1="1066.5" x2="1547.4" y2="1066.5" stroke="#141414" stroke-width="1.0"/><text x="40.0" y="1084.5" font-size="15" fill="#141414" text-anchor="start" font-weight="700" font-family="Helvetica,Arial,sans-serif">MAIN-ROOM NOOK UNIT</text><text x="40.0" y="1100.5" font-size="11" fill="#3d3d3d" text-anchor="start" font-weight="400" font-family="Helvetica,Arial,sans-serif">Sheet 3 — electrical</text><text x="1547.4" y="1084.5" font-size="11" fill="#9c2b1b" text-anchor="end" font-weight="700" font-family="Helvetica,Arial,sans-serif">DRAFT — 13 decisions open · NOT site-measured</text><text x="1547.4" y="1100.5" font-size="10" fill="#3d3d3d" text-anchor="end" font-weight="400" font-family="'DejaVu Sans Mono',Consolas,monospace">mm · A3 · sheet 3 of 3</text></svg>